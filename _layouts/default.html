<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="theme-color" content="#161616" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Dark mode (default) — softer greys ── */
    :root {
      --accent:     #cc0000;
      --accent-dim: #8b0000;
      --bg:         #161616;
      --bg2:        #1e1e1e;
      --bg3:        #272727;
      --text:       #e8e8e8;
      --text-dim:   #a8a8a8;
      --border:     #2e2e2e;
      --nav-bg:     rgba(22,22,22,0.95);
      --pre-bg:     #111111;
      --pre-border: #333333;
      --pre-text:   #c8c8c8;
      --nav-h:      64px;
      --side-bar:   6px;
      --radius:     4px;
      --transition: 0.3s ease;
    }

    /* ── Light mode — exact match to portfolio ── */
    html[data-theme="light"] {
      --bg:        #f4f4f4;
      --bg2:       #eaeaea;
      --bg3:       #dedede;
      --text:      #111111;
      --text-dim:  #555555;
      --border:    #cccccc;
      --nav-bg:    rgba(244,244,244,0.95);
      --pre-bg:    #1a1a1a;
      --pre-border:#333333;
      --pre-text:  #c8c8c8;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      border-left:  var(--side-bar) solid var(--accent);
      border-right: var(--side-bar) solid var(--accent);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }

    a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
    a:hover { color: #ff3333; }
    img { max-width: 100%; display: block; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0; left: var(--side-bar); right: var(--side-bar);
      height: var(--nav-h);
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      z-index: 1000;
    }

    .nav-logo { font-size: 1.2rem; font-weight: 700; color: var(--text); letter-spacing: 2px; text-transform: uppercase; }
    .nav-logo span { color: var(--accent); }
    .nav-logo a { color: var(--text); transition: color var(--transition); }
    .nav-logo a:hover { color: var(--accent); }

    .nav-links { display: flex; gap: 0.25rem; list-style: none; }
    .nav-links a {
      color: var(--text);
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      font-weight: 600;
      position: relative;
      padding: 0.35rem 0.75rem;
      border-radius: 3px;
      border: 1px solid transparent;
      transition: color var(--transition), background var(--transition), border-color var(--transition);
    }
    .nav-links a::before { content: '> '; color: var(--accent); opacity: 0; font-size: 0.7rem; transition: opacity var(--transition); }
    .nav-links a:hover { background: rgba(204,0,0,0.06); border-color: rgba(204,0,0,0.2); }
    .nav-links a:hover::before { opacity: 1; }

    /* ── Theme toggle — exact match to portfolio .theme-toggle ── */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-dim);
      cursor: pointer;
      width: 36px; height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: border-color var(--transition), color var(--transition), background var(--transition);
      flex-shrink: 0;
      margin-left: 0.5rem;
    }
    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(204,0,0,0.08);
    }

    /* ── Hero ── */
    .writeup-hero {
      max-width: 900px;
      margin: 0 auto;
      padding: calc(var(--nav-h) + 4rem) 2rem 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-family: 'Courier New', monospace;
    }
    .section-title::before { content: '> '; opacity: 0.5; }

    .hero-name {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .section-line { width: 48px; height: 3px; background: var(--accent); margin-bottom: 1.5rem; }

    .hero-meta {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .hero-meta span { color: var(--accent); }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 0.7rem 1.8rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      transition: var(--transition);
      border: 2px solid transparent;
      font-family: 'Roboto', sans-serif;
    }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Content ── */
    .writeup-body {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    .writeup-body > h1:first-child,
    .writeup-body > h1:first-child + p,
    .writeup-body > h1:first-child + p + hr { display: none; }

    .writeup-body h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      margin: 3.5rem 0 0.75rem;
    }

    .writeup-body h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin: 2.25rem 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .writeup-body h2::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 1em;
      background: var(--accent);
      border-radius: 1px;
      flex-shrink: 0;
    }

    .writeup-body h3 {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      margin: 1.75rem 0 0.6rem;
    }
    .writeup-body h3::before { content: '// '; opacity: 0.35; }

    .writeup-body p { color: var(--text-dim); margin-bottom: 1rem; font-size: 0.95rem; }
    .writeup-body strong { color: var(--text); }

    /* ── Inline code ── */
    .writeup-body code {
      font-family: 'Courier New', monospace;
      font-size: 0.82em;
      background: var(--bg3);
      color: #e06060;
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    /* ── Code blocks — always dark, readable in both modes ── */
    .writeup-body pre {
      background: var(--pre-bg);
      border: 1px solid var(--pre-border);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      overflow-x: auto;
      margin: 0.75rem 0 1.5rem;
    }
    .writeup-body pre code {
      display: block;
      background: none;
      border: none;
      padding: 1rem 1.2rem;
      color: var(--pre-text);
      font-size: 0.82rem;
      line-height: 1.65;
    }

    /* ── Blockquote ── */
    .writeup-body blockquote {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 0.9rem 1.25rem;
      margin: 1rem 0 1.25rem;
    }
    .writeup-body blockquote p { margin: 0; color: var(--text); font-size: 0.9rem; }

    /* ── Lists ── */
    .writeup-body ul, .writeup-body ol { margin: 0.5rem 0 1rem 1.5rem; color: var(--text-dim); font-size: 0.95rem; }
    .writeup-body li { margin-bottom: 0.3rem; }

    .writeup-body > ol {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 1rem 1rem 1rem 2.5rem;
      margin: 0 0 2rem;
      list-style: decimal;
    }
    .writeup-body > ol li { font-family: 'Courier New', monospace; font-size: 0.82rem; margin-bottom: 0.2rem; }
    .writeup-body > ol li a { color: var(--text-dim); }
    .writeup-body > ol li a:hover { color: var(--accent); }

    /* Skill tags */
    .writeup-body h3 + ul { margin-left: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .writeup-body h3 + ul li {
      padding: 0.25rem 0.65rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: 'Courier New', monospace;
      transition: var(--transition);
    }
    .writeup-body h3 + ul li:hover { border-color: var(--accent); color: var(--text); }

    /* ── Images ── */
    .writeup-body img {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 1rem 0;
      transition: border-color var(--transition);
    }
    .writeup-body img:hover { border-color: var(--accent); }

    /* ── HR ── */
    .writeup-body hr { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }

    /* ── Footnotes ── */
    .writeup-body .footnotes {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      font-family: 'Courier New', monospace;
    }
    .writeup-body .footnotes ol { color: var(--text-dim); font-size: 0.8rem; }
    .writeup-body .footnotes a { color: var(--text-dim); }
    .writeup-body .footnotes a:hover { color: var(--accent); }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    footer span { color: var(--accent); }
    footer a { color: var(--text-dim); }
    footer a:hover { color: var(--accent); }

    /* ── Scroll reveal ── */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 640px) {
      .nav-links { display: none; }
      .writeup-hero { padding: calc(var(--nav-h) + 2rem) 1.2rem 2rem; }
      .writeup-body { padding: 2rem 1.2rem 4rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo"><span>[</span><a href="https://shmilowitz.github.io/portfolio">Portfolio</a><span>]</span></div>
    <ul class="nav-links">
      <li><a href="https://shmilowitz.github.io/portfolio#about">About</a></li>
      <li><a href="https://shmilowitz.github.io/portfolio#skills">Skills</a></li>
      <li><a href="https://shmilowitz.github.io/portfolio#projects">Projects</a></li>
      <li><a href="https://shmilowitz.github.io/portfolio#contact">Contact</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">☀️</button>
  </nav>

  <div class="writeup-hero">
    <p class="section-title">writeup</p>
    <h1 class="hero-name">Øvelsesoperation</h1>
    <div class="section-line"></div>
    <div class="hero-meta">
      <div>mål:&nbsp;<span>root@printserver</span></div>
      <div>trin:&nbsp;<span>11</span></div>
      <div>status:&nbsp;<span>WIP</span></div>
    </div>
    <div style="margin-top:1.75rem">
      <a href="https://github.com/Shmilowitz/writeup_fe-ctf" target="_blank" class="btn btn-outline">&#10697; View Source on GitHub</a>
    </div>
  </div>

  <div class="writeup-body">
    {{ content }}
  </div>

  <footer>
    <p>Built with <span>&#10084;</span> by David &mdash; <span>&copy; 2026</span></p>
    <p style="margin-top:0.4rem;font-size:0.72rem;opacity:0.5">Think like an attacker. Defend like a professional.</p>
  </footer>

  <script>
    // ── Theme toggle — mirrors portfolio script.js exactly ──
    const toggle = document.getElementById('themeToggle');
    const html = document.documentElement;

    function applyTheme(theme) {
      if (theme === 'light') {
        html.setAttribute('data-theme', 'light');
        toggle.textContent = '🌙';
      } else {
        html.removeAttribute('data-theme');
        toggle.textContent = '☀️';
      }
    }

    // On load, read from localStorage (syncs with portfolio)
    const saved = localStorage.getItem('theme') || 'dark';
    applyTheme(saved);

    toggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // ── Scroll reveal ──
    const els = document.querySelectorAll('.writeup-body > *');
    els.forEach(el => el.classList.add('reveal'));
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
    }, { threshold: 0.06 });
    els.forEach(el => io.observe(el));
  </script>

</body>
</html>
